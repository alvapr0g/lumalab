# Merge a main: publica en lumalab.io (sitio luma-labs-comunity).
# Los cambios solo de documentación no publican.
name: deploy-prod

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://lumalab.io
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUMA_LABS_COMUNITY }}
          projectId: luma-labs-comunity
          target: prod
          channelId: live
