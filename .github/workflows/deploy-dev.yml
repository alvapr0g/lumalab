# Push o merge a development: publica en dev.lumalab.io (sitio luma-labs-comunity-dev).
# Los cambios solo de documentación no publican.
name: deploy-dev

on:
  push:
    branches: [development]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUMA_LABS_COMUNITY }}
          projectId: luma-labs-comunity
          target: dev
          channelId: live
